basePath: /
definitions:
  go_auth_internal_apierror.Body:
    properties:
      error:
        $ref: '#/definitions/go_auth_internal_apierror.Detail'
    type: object
  go_auth_internal_apierror.Detail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  go_auth_internal_application.Application:
    properties:
      active:
        type: boolean
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      uuid:
        type: string
    type: object
  go_auth_internal_permission.Permission:
    properties:
      active:
        type: boolean
      application_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  go_auth_internal_role.Role:
    properties:
      active:
        type: boolean
      application_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      uuid:
        type: string
    type: object
  go_auth_internal_user.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
      uuid:
        type: string
    type: object
  internal_access.AssignRequest:
    properties:
      application_id:
        type: integer
      profile_id:
        type: integer
      role_id:
        type: integer
    required:
    - application_id
    - role_id
    type: object
  internal_access.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_access.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/internal_access.UserInfo'
    type: object
  internal_access.UserApplicationAccess:
    properties:
      application:
        $ref: '#/definitions/go_auth_internal_application.Application'
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
    type: object
  internal_access.UserApplicationRole:
    properties:
      application_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      profile_id:
        type: integer
      role_id:
        type: integer
      user_id:
        type: integer
    type: object
  internal_access.UserInfo:
    properties:
      applications:
        items:
          $ref: '#/definitions/internal_access.UserApplicationAccess'
        type: array
      email:
        type: string
      id:
        type: integer
      username:
        type: string
      uuid:
        type: string
    type: object
  internal_application.Application:
    properties:
      active:
        type: boolean
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      uuid:
        type: string
    type: object
  internal_application.CreateRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      slug:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    - slug
    type: object
  internal_application.UpdateRequest:
    properties:
      active:
        type: boolean
      description:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      slug:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    - slug
    type: object
  internal_permission.CreateRequest:
    properties:
      application_id:
        type: integer
      description:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      slug:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - application_id
    - name
    - slug
    type: object
  internal_permission.Permission:
    properties:
      active:
        type: boolean
      application_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  internal_permission.UpdateRequest:
    properties:
      active:
        type: boolean
      description:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      slug:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    - slug
    type: object
  internal_role.AssignPermissionRequest:
    properties:
      permission_id:
        type: integer
    required:
    - permission_id
    type: object
  internal_role.CreateRequest:
    properties:
      application_id:
        type: integer
      description:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      slug:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - application_id
    - name
    - slug
    type: object
  internal_role.Role:
    properties:
      active:
        type: boolean
      application_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      uuid:
        type: string
    type: object
  internal_role.UpdateRequest:
    properties:
      active:
        type: boolean
      description:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      slug:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    - slug
    type: object
  internal_user.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  internal_user.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
      uuid:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API de autenticação e autorização em Go com JWT, suportando múltiplas
    aplicações
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go Auth API
  version: "1.0"
paths:
  /api/admin/application-roles/users/{userId}/applications/{applicationId}/roles:
    get:
      consumes:
      - application/json
      description: Retrieve all roles assigned to a user within a specific application
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      - description: Application ID
        in: path
        name: applicationId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/go_auth_internal_role.Role'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Get user roles in application
      tags:
      - Admin - User-Application-Role Relationships
  /api/admin/applications:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all applications in the system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_application.Application'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Get all applications
      tags:
      - Admin - Applications
    post:
      consumes:
      - application/json
      description: Create a new application in the system
      parameters:
      - description: Application data
        in: body
        name: application
        required: true
        schema:
          $ref: '#/definitions/internal_application.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_application.Application'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Create a new application
      tags:
      - Admin - Applications
  /api/admin/applications/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an application by ID
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Delete an application
      tags:
      - Admin - Applications
    get:
      consumes:
      - application/json
      description: Retrieve a specific application by its ID
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_application.Application'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Get application by ID
      tags:
      - Admin - Applications
    put:
      consumes:
      - application/json
      description: Update an existing application's fields
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      - description: Application data
        in: body
        name: application
        required: true
        schema:
          $ref: '#/definitions/internal_application.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Update an application
      tags:
      - Admin - Applications
  /api/admin/applications/{id}/users:
    get:
      consumes:
      - application/json
      description: Retrieve all users assigned to a specific application
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/go_auth_internal_user.User'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Get application users
      tags:
      - Admin - User-Application-Role Relationships
  /api/admin/permissions:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all permissions, optionally filtered by application_id
      parameters:
      - description: Filter by application ID
        in: query
        name: application_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_permission.Permission'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Get all permissions
      tags:
      - Admin - Permissions
    post:
      consumes:
      - application/json
      description: Create a new permission associated with an application
      parameters:
      - description: Permission data
        in: body
        name: permission
        required: true
        schema:
          $ref: '#/definitions/internal_permission.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_permission.Permission'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Create a new permission
      tags:
      - Admin - Permissions
  /api/admin/permissions/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a permission by ID
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Delete a permission
      tags:
      - Admin - Permissions
    get:
      consumes:
      - application/json
      description: Retrieve a specific permission by its ID
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_permission.Permission'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Get permission by ID
      tags:
      - Admin - Permissions
    put:
      consumes:
      - application/json
      description: Update an existing permission's fields
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      - description: Permission data
        in: body
        name: permission
        required: true
        schema:
          $ref: '#/definitions/internal_permission.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Update a permission
      tags:
      - Admin - Permissions
  /api/admin/roles:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all roles, optionally filtered by application_id
      parameters:
      - description: Filter by application ID
        in: query
        name: application_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_role.Role'
            type: array
      security:
      - Bearer: []
      summary: Get all roles
      tags:
      - Admin - Roles
    post:
      consumes:
      - application/json
      description: Create a new role associated with an application
      parameters:
      - description: Role data
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/internal_role.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_role.Role'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Create a new role
      tags:
      - Admin - Roles
  /api/admin/roles/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a role by ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Delete a role
      tags:
      - Admin - Roles
    get:
      consumes:
      - application/json
      description: Retrieve a specific role by its ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_role.Role'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Get role by ID
      tags:
      - Admin - Roles
    put:
      consumes:
      - application/json
      description: Update an existing role's fields
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role data
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/internal_role.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Update a role
      tags:
      - Admin - Roles
  /api/admin/roles/{id}/permissions:
    get:
      consumes:
      - application/json
      description: Retrieve all permissions assigned to a specific role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/go_auth_internal_permission.Permission'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: List role permissions
      tags:
      - Admin - Role-Permission Relationships
    post:
      consumes:
      - application/json
      description: Assign a permission to a specific role (both must belong to the
        same application)
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Permission assignment data
        in: body
        name: assignment
        required: true
        schema:
          $ref: '#/definitions/internal_role.AssignPermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Assign permission to role
      tags:
      - Admin - Role-Permission Relationships
  /api/admin/roles/{id}/permissions/{permissionId}:
    delete:
      consumes:
      - application/json
      description: Remove a permission from a specific role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Permission ID
        in: path
        name: permissionId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Remove permission from role
      tags:
      - Admin - Role-Permission Relationships
  /api/admin/users:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all users registered in the system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_user.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: List all users
      tags:
      - Admin - Users
  /api/admin/users/{id}/application-roles:
    get:
      consumes:
      - application/json
      description: Retrieve all application-role assignments for a specific user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_access.UserApplicationRole'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Get user application roles
      tags:
      - Admin - User-Application-Role Relationships
    post:
      consumes:
      - application/json
      description: Assign a specific role to a user within an application context
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Assignment data
        in: body
        name: assignment
        required: true
        schema:
          $ref: '#/definitions/internal_access.AssignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Assign role to user in application
      tags:
      - Admin - User-Application-Role Relationships
  /api/admin/users/{id}/application-roles/{applicationId}/{roleId}:
    delete:
      consumes:
      - application/json
      description: Remove a specific role from a user within an application context
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Application ID
        in: path
        name: applicationId
        required: true
        type: integer
      - description: Role ID
        in: path
        name: roleId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_apierror.Body'
      security:
      - Bearer: []
      summary: Remove role from user in application
      tags:
      - Admin - User-Application-Role Relationships
  /api/admin/users/{id}/applications:
    get:
      consumes:
      - application/json
      description: Retrieve all applications assigned to a specific user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/go_auth_internal_application.Application'
            type: array
